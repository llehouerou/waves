name: CI

on:
  # main's runs save the Go cache: a pull request can only restore a cache saved on main or on itself.
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Go version
        id: go
        run: echo "version=$(nix develop --command go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          # A key per run, so each run saves a fresh cache; the next one restores the newest.
          key: go-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: go-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum') }}-

      # go test reuses a cached result only if the files the tests opened kept their size and mtime,
      # and checkout gives every file a fresh mtime: derive each file's mtime from its blob ID, in the past.
      - name: File times from content
        run: |
          git ls-files -s | while read -r _ blob _ path; do touch -d "@$((16#${blob:0:8} % 1000000000))" "$path"; done
          find . -path ./.git -prune -o -type d -exec touch -d @0 {} +

      # nix develop sets a new TMPDIR each time, and the tests that use t.TempDir read it: go test keys their result on it.
      - name: Check
        run: nix develop --command env TMPDIR=/tmp make check
